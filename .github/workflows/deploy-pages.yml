name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish from a feature branch before merging.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # bun.lock pins tarballs to Lovable's private registry mirror, which is not
      # reachable from GitHub-hosted runners, so resolve from npm instead.
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund --registry=https://registry.npmjs.org

      # Reads GITHUB_REPOSITORY to derive the /<repo>/ base path. Supabase
      # credentials come from the committed .env; they are publishable keys.
      - name: Build static site
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
