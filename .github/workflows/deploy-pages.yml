name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish from a feature branch before merging.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci is deliberately not used here. ajv is an optional peer dependency of
      # @hookform/resolvers, and npm writes a lockfile for it that its own `npm ci`
      # ideal-tree check then rejects ("Invalid: lock file's ajv@6 does not satisfy
      # ajv@8"), even immediately after a clean `npm install`. `npm install` still
      # installs from the committed lockfile, so versions stay pinned.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Creates the Pages site if the repo has none. It does NOT change an existing
      # site's source, which is what the next step is for.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # A Pages site left on "Deploy from a branch" serves Jekyll's render of the
      # repo (README.md as the home page) and silently ignores this workflow's
      # artifact — while deploy-pages still reports success. Force the source to
      # GitHub Actions so that cannot happen.
      - name: Ensure Pages source is GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow; then
            echo "Pages source set to GitHub Actions."
          else
            echo "::warning::Could not set the Pages source. If the site shows the README instead of the app, set Settings > Pages > Source to GitHub Actions by hand."
          fi

      # Reads GITHUB_REPOSITORY to derive the /<repo>/ base path. Supabase
      # credentials come from the committed .env; they are publishable keys.
      - name: Build static site
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
