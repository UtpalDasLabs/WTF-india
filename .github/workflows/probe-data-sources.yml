name: Probe data.gov.in

# A diagnostic, not part of the build. The development sandbox cannot reach
# data.gov.in, so this runs the lookup on a runner and prints what it finds into
# the log. Run it by hand from the Actions tab whenever we need to find or
# re-check a dataset.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # The client's metadata sync can sit for a long time; never tie up a runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the data.gov.in client
        run: pip install --quiet datagovindia pandas

      - name: Search the catalogue and describe what it finds
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          # Without this, Python buffers stdout and the log stays empty until the
          # process exits — which made a slow run indistinguishable from a hung one.
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/probe-data-gov.py
