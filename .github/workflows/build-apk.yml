name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    # Publishing the rolling release below needs write access to the repo's
    # contents. Nothing else here does, so it is granted per-job rather than
    # to the whole workflow.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8's Android project targets JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # npm ci is deliberately not used here. ajv is an optional peer dependency of
      # @hookform/resolvers, and npm writes a lockfile for it that its own `npm ci`
      # ideal-tree check then rejects ("Invalid: lock file's ajv@6 does not satisfy
      # ajv@8"), even immediately after a clean `npm install`. `npm install` still
      # installs from the committed lockfile, so versions stay pinned.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Builds the SPA rooted at "/" and copies it into android/app/src/main/assets,
      # which is gitignored, so this step is what puts the web app inside the APK.
      - name: Build web bundle and sync to Android
        run: npm run build:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the debug APK after the commit
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/we-the-future-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: we-the-future-debug-apk
          path: artifacts/*.apk
          if-no-files-found: error

      # Actions artifacts can only be downloaded by a logged-in GitHub user, so the
      # website cannot link to one. A release asset can be downloaded by anybody, so
      # the same debug APK is also pushed to a single rolling release tagged "latest".
      # The asset name is deliberately fixed (no commit sha) so that
      #   https://github.com/${{ github.repository }}/releases/latest/download/we-the-future.apk
      # is a permanent URL the site can hardcode.
      - name: Publish the debug APK to the rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest
        run: |
          set -euo pipefail

          # The release asset keeps a fixed name; the Actions artifact above keeps
          # its sha-stamped one.
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/we-the-future.apk

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Automatic **debug** build of the current \`main\` branch. It is rebuilt and
          replaced on every push to \`main\`, so the link below always serves the newest
          build.

          - Commit: \`$GITHUB_SHA\`
          - Built: $(date -u '+%Y-%m-%d %H:%M UTC')
          - Download: <https://github.com/$GITHUB_REPOSITORY/releases/latest/download/we-the-future.apk>

          **This is a debug build.** It is not signed with a Play Store release key, so
          it cannot be published to the Play Store and Android will refuse to install it
          until you allow installs from **unknown sources** for whichever app (browser,
          file manager) you open the APK with.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Point the rolling tag at the commit that was just built. Editing a
            # published release cannot move its tag, so the ref is moved directly.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null \
              || echo "::warning::Could not move the $TAG tag to $GITHUB_SHA."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Latest main build (debug)" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --draft=false --latest
          else
            # First ever run: no release and no tag yet, so create both.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Latest main build (debug)" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi

          # --clobber replaces the asset from the previous run, and is a no-op-safe
          # plain upload when the release has no asset yet.
          gh release upload "$TAG" artifacts/we-the-future.apk \
            --repo "$GITHUB_REPOSITORY" --clobber

      # A release APK is only worth producing when it can be signed — an unsigned one
      # will not install. Configure the four secrets below to turn this on.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret set, so only a debug APK was built."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: we-the-future-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
